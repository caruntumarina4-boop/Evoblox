<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evoblox Texture Library</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #181818;
    padding: 18px;
    border-bottom: 1px solid #333;
}

h1 {
    margin: 0 0 12px;
    font-size: 26px;
}

#search {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: white;
    font-size: 16px;
    outline: none;
}

#count {
    margin-top: 8px;
    color: #999;
}

.header-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.header-actions button {
    padding: 11px 18px;
    background: #1a3;
    color: #fff;
    border: 1px solid #2e8;
    border-radius: 10px;
    cursor: pointer;
}

.header-actions button:hover {
    background: #2e8;
}

main {
    padding: 20px;
}

.modal-root,
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 200;
}

.hidden {
    display: none !important;
}

.modal-content,
.editor-panel {
    background: #121212;
    border: 1px solid #333;
    border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
}

.modal-content {
    width: min(540px, 100%);
    padding: 24px;
    position: relative;
}

.modal-content h2,
.modal-content h3 {
    margin-top: 0;
}

.modal-close {
    position: absolute;
    right: 18px;
    top: 18px;
    border: none;
    background: transparent;
    color: #eee;
    font-size: 18px;
    cursor: pointer;
}

.modal-content label,
.modal-content input,
.modal-content select,
.modal-content textarea {
    display: block;
    width: 100%;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
    margin-top: 8px;
    margin-bottom: 16px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
}

.modal-content textarea {
    min-height: 120px;
    resize: vertical;
}

.modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.modal-actions button {
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #1a3;
    color: #fff;
}

.modal-actions button.secondary {
    background: #333;
}

.editor-panel {
    width: min(1200px, 100%);
    max-height: calc(100vh - 40px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid #333;
}

.editor-title {
    font-size: 22px;
    font-weight: bold;
}

.editor-subtitle {
    margin-top: 6px;
    color: #aaa;
    font-size: 14px;
}

.editor-topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid #333;
    background: #161616;
}

.editor-topbar button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: #fff;
    cursor: pointer;
}

.editor-topbar button:hover {
    background: #2e8;
}

.editor-body {
    display: grid;
    grid-template-columns: 250px minmax(420px, 1fr) 250px;
    gap: 16px;
    padding: 20px;
    overflow: hidden;
    flex: 1;
}

.editor-left,
.editor-right {
    background: #181818;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: auto;
}

.editor-center {
    background: #111;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
}

.canvas-frame {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 420px;
    background: #000;
    border: 1px solid #222;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas.editor-canvas,
canvas.overlay,
canvas.text-layer {
    width: 100%;
    height: 100%;
    display: block;
}

canvas.editor-canvas {
    position: relative;
    image-rendering: pixelated;
    background: transparent;
}

canvas.overlay,
canvas.text-layer {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
}

.tool-button,
.small-button,
.meta-button {
    padding: 10px 12px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #212121;
    color: #fff;
    cursor: pointer;
    text-align: left;
}

.tool-button.active,
.small-button.active,
.meta-button.active {
    border-color: #2e8;
    background: #163;
}

.editor-right label {
    font-size: 14px;
    color: #ddd;
}

.editor-right input[type="range"] {
    width: 100%;
}

.editor-right input[type="color"] {
    width: 100%;
    height: 44px;
    padding: 0;
    border-radius: 12px;
}

.editor-message {
    color: #9f9;
    min-height: 28px;
}

.media-controls {
    display: grid;
    gap: 10px;
}

.my-textures-list {
    display: grid;
    gap: 12px;
}

.my-texture-card {
    background: #141414;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 14px;
}

.my-texture-card h4 {
    margin: 0 0 8px;
}

.my-texture-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
}

.my-texture-actions button {
    flex: 1;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.folder {
    margin-bottom: 30px;
}

.folder-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
}

.card {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 200px;
    display: block;
    object-fit: contain;
    background: #080808;
}

.info {
    padding: 12px;
}

.name {
    font-weight: bold;
    word-break: break-word;
}

.path {
    margin-top: 6px;
    color: #888;
    font-size: 12px;
    word-break: break-all;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

button,
.open {
    flex: 1;
    padding: 9px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
}

button {
    background: #333;
    color: white;
}

.open {
    background: white;
    color: black;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #aaa;
}

.error {
    background: #300;
    border: 1px solid #700;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>

    <h1>🍌 Evoblox Texture Library</h1>

    <input
        id="search"
        type="text"
        placeholder="Caută imagine sau folder..."
    >

    <div class="header-actions">
        <button id="openCreateButton">Create</button>
        <button id="openMyTexturesButton">My Textures</button>
    </div>

    <div id="count">
        Se încarcă imaginile...
    </div>

</header>

<main>

    <div id="content" class="loading">
        Se încarcă toate imaginile din GitHub...
    </div>

</main>

<div id="createAccessModal" class="modal-root hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
        <button class="modal-close" id="closeCreateAccess">×</button>
        <h2>Create Access</h2>
        <p>Enter the private access password to continue.</p>
        <label for="createPassword">Password</label>
        <div style="position:relative; display:flex; gap:8px; align-items:center;">
            <input id="createPassword" type="password" autocomplete="current-password" placeholder="Private password">
            <button id="togglePassword" class="small-button" type="button">Show</button>
        </div>
        <div id="createAccessError" style="color:#f66; min-height:24px;"></div>
        <div class="modal-actions">
            <button id="cancelCreateAccess" class="secondary">Cancel</button>
            <button id="continueCreateAccess">Continue</button>
        </div>
    </div>
</div>

<div id="createEditorModal" class="modal-root hidden" role="dialog" aria-modal="true">
    <div class="editor-panel">
        <div class="editor-header">
            <div>
                <div class="editor-title">Create Texture</div>
                <div class="editor-subtitle">Use the tools to create or edit your texture.</div>
            </div>
            <button id="closeEditor" class="modal-close">×</button>
        </div>
        <div class="editor-topbar">
            <button id="newTexture">New</button>
            <button id="uploadImage">Upload</button>
            <button id="undoButton">Undo</button>
            <button id="redoButton">Redo</button>
            <button id="resetButton">Reset</button>
            <button id="saveDraft">Save</button>
            <button id="publishTexture">Publish</button>
        </div>
        <div class="editor-body">
            <div class="editor-left">
                <button class="tool-button active" data-tool="pencil">Pencil</button>
                <button class="tool-button" data-tool="brush">Brush</button>
                <button class="tool-button" data-tool="eraser">Eraser</button>
                <button class="tool-button" data-tool="fill">Fill</button>
                <button class="tool-button" data-tool="text">Text</button>
                <button class="tool-button" data-tool="line">Line</button>
                <button class="tool-button" data-tool="rectangle">Rectangle</button>
                <button class="tool-button" data-tool="circle">Circle</button>
                <button class="tool-button" data-tool="select">Select</button>
                <button class="tool-button" data-tool="move">Move</button>
                <button class="tool-button" data-tool="crop">Crop</button>
                <div class="media-controls">
                    <button id="openMyTextures">My Textures</button>
                </div>
            </div>
            <div class="editor-center">
                <div class="canvas-frame">
                    <canvas id="editorCanvas" class="editor-canvas"></canvas>
                    <canvas id="overlayCanvas" class="overlay"></canvas>
                    <canvas id="textCanvas" class="text-layer"></canvas>
                </div>
                <div class="editor-message" id="editorMessage"></div>
            </div>
            <div class="editor-right">
                <label>Color</label>
                <input id="colorPicker" type="color" value="#00ff00">
                <label>Brush Size</label>
                <input id="brushSize" type="range" min="1" max="64" value="8">
                <label>Opacity</label>
                <input id="opacity" type="range" min="0.1" max="1" step="0.1" value="1">
                <label>Brightness</label>
                <input id="brightness" type="range" min="0" max="200" value="100">
                <label>Contrast</label>
                <input id="contrast" type="range" min="0" max="200" value="100">
                <label>Saturation</label>
                <input id="saturation" type="range" min="0" max="200" value="100">
                <label>Blur</label>
                <input id="blur" type="range" min="0" max="20" value="0">
                <button id="grayscaleButton" class="meta-button">Grayscale</button>
                <button id="sepiaButton" class="meta-button">Sepia</button>
                <button id="invertButton" class="meta-button">Invert</button>
            </div>
        </div>
    </div>
</div>

<div id="publishModal" class="modal-root hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
        <button class="modal-close" id="closePublishModal">×</button>
        <h2>Publish Texture</h2>
        <label for="publishName">Texture Name</label>
        <input id="publishName" type="text" placeholder="Banana Player">
        <label for="publishDescription">Description</label>
        <textarea id="publishDescription" placeholder="Custom Evoblox texture."></textarea>
        <label for="publishCategory">Category</label>
        <select id="publishCategory">
            <option value="Player">Player</option>
            <option value="Community">Community</option>
            <option value="Premium">Premium</option>
        </select>
        <label for="publishTags">Tags</label>
        <input id="publishTags" type="text" placeholder="banana, player, texture">
        <div id="publishError" style="color:#f66; min-height:24px;"></div>
        <div class="modal-actions">
            <button id="cancelPublish" class="secondary">Cancel</button>
            <button id="confirmPublish">Publish Texture</button>
        </div>
    </div>
</div>

<div id="myTexturesModal" class="modal-root hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
        <button class="modal-close" id="closeMyTextures">×</button>
        <h2>My Textures</h2>
        <div id="myTexturesList" class="my-textures-list"></div>
    </div>
</div>

<script>

const OWNER = "caruntumarina4-boop";
const REPOSITORY = "Evoblox";
const BRANCH = "main";

const BASE_URL =
    `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/${BRANCH}`;

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`;

let allImages = [];


async function loadImages() {

    const content = document.getElementById("content");
    const count = document.getElementById("count");

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("GitHub API error: " + response.status);
        }

        const data = await response.json();

        if (!data.tree) {
            throw new Error("GitHub nu a returnat lista fișierelor.");
        }

        allImages = data.tree
            .filter(item => item.type === "blob")
            .filter(item => {

                const extension =
                    item.path.split(".").pop().toLowerCase();

                return [
                    "png",
                    "jpg",
                    "jpeg",
                    "webp",
                    "gif",
                    "bmp"
                ].includes(extension);

            })
            .map(item => {

                const encodedPath = item.path
                    .split("/")
                    .map(part => encodeURIComponent(part))
                    .join("/");

                return {
                    name: item.path.split("/").pop(),
                    path: item.path,
                    url: `${BASE_URL}/${encodedPath}`
                };

            });

        renderImages(allImages);

    } catch (error) {

        content.innerHTML = `
            <div class="error">
                <h2>Nu am putut încărca imaginile.</h2>
                <p>${error.message}</p>
            </div>
        `;

        count.textContent = "Eroare";

        console.error(error);
    }
}


function renderImages(images) {

    const content = document.getElementById("content");
    const count = document.getElementById("count");

    content.className = "";

    if (images.length === 0) {

        content.innerHTML = `
            <div class="loading">
                Nu există imagini găsite.
            </div>
        `;

        count.textContent = "0 imagini";

        return;
    }


    const folders = {};


    images.forEach(image => {

        const parts = image.path.split("/");

        let folder;

        if (parts.length === 1) {
            folder = "ROOT";
        } else {
            folder = parts[0];
        }

        if (!folders[folder]) {
            folders[folder] = [];
        }

        folders[folder].push(image);

    });


    content.innerHTML = "";


    Object.keys(folders)
        .sort()
        .forEach(folderName => {

            const folder = document.createElement("section");

            folder.className = "folder";


            const title = document.createElement("div");

            title.className = "folder-title";

            title.textContent =
                folderName + " (" + folders[folderName].length + ")";


            const grid = document.createElement("div");

            grid.className = "grid";


            folders[folderName].forEach((image, index) => {

                const card = document.createElement("div");

                card.className = "card";


                card.innerHTML = `

                    <a
                        href="${image.url}"
                        target="_blank"
                    >

                        <img
                            src="${image.url}"
                            loading="lazy"
                            alt="${escapeHtml(image.name)}"
                        >

                    </a>


                    <div class="info">

                        <div class="name">
                            ${index + 1}. ${escapeHtml(image.name)}
                        </div>


                        <div class="path">
                            ${escapeHtml(image.path)}
                        </div>


                        <div class="buttons">

                            <a
                                class="open"
                                href="${image.url}"
                                target="_blank"
                            >
                                Open
                            </a>


                            <button
                                onclick="copyLink('${escapeAttribute(image.url)}', this)"
                            >
                                Copy link
                            </button>

                        </div>

                    </div>

                `;


                grid.appendChild(card);

            });


            folder.appendChild(title);

            folder.appendChild(grid);

            content.appendChild(folder);

        });


    count.textContent =
        images.length + " imagini";

}


function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(text) {

    return text
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");

}


async function copyLink(url, button) {

    try {

        await navigator.clipboard.writeText(url);

        const oldText = button.textContent;

        button.textContent = "✓ Copiat!";

        setTimeout(() => {

            button.textContent = oldText;

        }, 1200);

    } catch {

        prompt(
            "Copiază linkul:",
            url
        );

    }

}

const state = {
    tool: 'pencil',
    color: '#00ff00',
    size: 8,
    opacity: 1,
    brightness: 100,
    contrast: 100,
    saturation: 100,
    blur: 0,
    drawing: false,
    lastPointer: null,
    history: [],
    historyIndex: -1,
    canvasSize: { width: 256, height: 256 },
    authorized: false,
    startShape: null,
};

const canvas = document.getElementById('editorCanvas');
const overlay = document.getElementById('overlayCanvas');
const canvasContext = canvas.getContext('2d');
const overlayContext = overlay.getContext('2d');
const editorMessage = document.getElementById('editorMessage');

function resizeEditorCanvas(width, height) {
    canvas.width = width;
    canvas.height = height;
    overlay.width = width;
    overlay.height = height;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
}

function setMessage(message, isError = false) {
    editorMessage.textContent = message;
    editorMessage.style.color = isError ? '#f66' : '#9f9';
}

function pushHistory() {
    const snapshot = canvas.toDataURL('image/png');
    if (state.historyIndex < state.history.length - 1) {
        state.history = state.history.slice(0, state.historyIndex + 1);
    }
    state.history.push(snapshot);
    state.historyIndex = state.history.length - 1;
}

function undo() {
    if (state.historyIndex > 0) {
        state.historyIndex -= 1;
        loadCanvasFromDataUrl(state.history[state.historyIndex]);
    }
}

function redo() {
    if (state.historyIndex < state.history.length - 1) {
        state.historyIndex += 1;
        loadCanvasFromDataUrl(state.history[state.historyIndex]);
    }
}

function loadCanvasFromDataUrl(dataUrl) {
    const img = new Image();
    img.onload = () => {
        canvasContext.clearRect(0, 0, canvas.width, canvas.height);
        canvasContext.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
    img.src = dataUrl;
}

function resetEditor() {
    canvasContext.clearRect(0, 0, canvas.width, canvas.height);
    canvasContext.fillStyle = 'rgba(0,0,0,0)';
    canvasContext.fillRect(0, 0, canvas.width, canvas.height);
    pushHistory();
}

function initNewTexture(width, height) {
    state.canvasSize = { width, height };
    resizeEditorCanvas(width, height);
    resetEditor();
    setMessage('New texture canvas created.');
}

function setActiveTool(tool) {
    state.tool = tool;
    document.querySelectorAll('.tool-button').forEach(button => {
        button.classList.toggle('active', button.dataset.tool === tool);
    });
}

function updateBrush() {
    state.color = document.getElementById('colorPicker').value;
    state.size = Number(document.getElementById('brushSize').value);
    state.opacity = Number(document.getElementById('opacity').value);
    state.brightness = Number(document.getElementById('brightness').value);
    state.contrast = Number(document.getElementById('contrast').value);
    state.saturation = Number(document.getElementById('saturation').value);
    state.blur = Number(document.getElementById('blur').value);
}

function getCanvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (canvas.width / rect.width);
    const y = (event.clientY - rect.top) * (canvas.height / rect.height);
    return { x, y };
}

function drawLine(from, to) {
    canvasContext.save();
    canvasContext.lineCap = 'round';
    canvasContext.lineJoin = 'round';
    canvasContext.strokeStyle = state.tool === 'eraser' ? 'rgba(0,0,0,1)' : state.color;
    canvasContext.globalAlpha = state.tool === 'eraser' ? 1 : state.opacity;
    canvasContext.lineWidth = state.size;
    if (state.tool === 'eraser') {
        canvasContext.globalCompositeOperation = 'destination-out';
    } else {
        canvasContext.globalCompositeOperation = 'source-over';
    }
    canvasContext.beginPath();
    canvasContext.moveTo(from.x, from.y);
    canvasContext.lineTo(to.x, to.y);
    canvasContext.stroke();
    canvasContext.restore();
}

function startStroke(event) {
    event.preventDefault();
    updateBrush();
    state.drawing = true;
    const point = getCanvasPoint(event);
    state.lastPointer = point;
    if (state.tool === 'fill') {
        fillAt(point.x, point.y);
        pushHistory();
    } else if (state.tool === 'text') {
        addTextAt(point.x, point.y);
    } else if (['line', 'rectangle', 'circle'].includes(state.tool)) {
        overlayContext.clearRect(0, 0, overlay.width, overlay.height);
        state.startShape = point;
    }
}

function moveStroke(event) {
    if (!state.drawing) return;
    const point = getCanvasPoint(event);
    if (['pencil', 'brush', 'eraser'].includes(state.tool)) {
        drawLine(state.lastPointer, point);
        state.lastPointer = point;
    } else if (['line', 'rectangle', 'circle'].includes(state.tool) && state.startShape) {
        overlayContext.clearRect(0, 0, overlay.width, overlay.height);
        drawPreviewShape(state.startShape, point);
    }
}

function endStroke(event) {
    if (!state.drawing) return;
    const point = getCanvasPoint(event);
    if (['line', 'rectangle', 'circle'].includes(state.tool) && state.startShape) {
        applyShape(state.startShape, point);
    }
    state.drawing = false;
    state.lastPointer = null;
    state.startShape = null;
    overlayContext.clearRect(0, 0, overlay.width, overlay.height);
    pushHistory();
}

function drawPreviewShape(start, end) {
    overlayContext.save();
    overlayContext.clearRect(0, 0, overlay.width, overlay.height);
    overlayContext.strokeStyle = state.color;
    overlayContext.lineWidth = state.size;
    overlayContext.globalAlpha = state.opacity;
    overlayContext.beginPath();
    if (state.tool === 'line') {
        overlayContext.moveTo(start.x, start.y);
        overlayContext.lineTo(end.x, end.y);
    } else if (state.tool === 'rectangle') {
        overlayContext.rect(start.x, start.y, end.x - start.x, end.y - start.y);
    } else if (state.tool === 'circle') {
        const radius = Math.hypot(end.x - start.x, end.y - start.y);
        overlayContext.arc(start.x, start.y, radius, 0, Math.PI * 2);
    }
    overlayContext.stroke();
    overlayContext.restore();
}

function applyShape(start, end) {
    canvasContext.save();
    canvasContext.strokeStyle = state.color;
    canvasContext.lineWidth = state.size;
    canvasContext.globalAlpha = state.opacity;
    canvasContext.beginPath();
    if (state.tool === 'line') {
        canvasContext.moveTo(start.x, start.y);
        canvasContext.lineTo(end.x, end.y);
    } else if (state.tool === 'rectangle') {
        canvasContext.rect(start.x, start.y, end.x - start.x, end.y - start.y);
    } else if (state.tool === 'circle') {
        const radius = Math.hypot(end.x - start.x, end.y - start.y);
        canvasContext.arc(start.x, start.y, radius, 0, Math.PI * 2);
    }
    canvasContext.stroke();
    canvasContext.restore();
}

function addTextAt(x, y) {
    const text = prompt('Enter text to add:');
    if (!text) return;
    canvasContext.save();
    canvasContext.font = `${state.size * 3}px Arial`;
    canvasContext.fillStyle = state.color;
    canvasContext.globalAlpha = state.opacity;
    canvasContext.fillText(text, x, y);
    canvasContext.restore();
    pushHistory();
    setMessage('Text added to canvas.');
}

function fillAt(x, y) {
    const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
    const targetColor = getPixel(imageData, Math.floor(x), Math.floor(y));
    const fillColor = hexToRgba(state.color, state.opacity);
    if (targetColor.join(',') === fillColor.join(',')) return;
    floodFill(imageData, Math.floor(x), Math.floor(y), targetColor, fillColor);
    canvasContext.putImageData(imageData, 0, 0);
    setMessage('Filled area.');
}

function getPixel(imageData, x, y) {
    const index = (y * imageData.width + x) * 4;
    return [imageData.data[index], imageData.data[index + 1], imageData.data[index + 2], imageData.data[index + 3]];
}

function setPixel(imageData, x, y, color) {
    const index = (y * imageData.width + x) * 4;
    imageData.data[index] = color[0];
    imageData.data[index + 1] = color[1];
    imageData.data[index + 2] = color[2];
    imageData.data[index + 3] = color[3];
}

function floodFill(imageData, x, y, targetColor, fillColor) {
    const width = imageData.width;
    const height = imageData.height;
    const stack = [[x, y]];
    const target = targetColor.join(',');
    while (stack.length) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= width || cy >= height) continue;
        const current = getPixel(imageData, cx, cy).join(',');
        if (current !== target) continue;
        setPixel(imageData, cx, cy, fillColor);
        stack.push([cx + 1, cy]);
        stack.push([cx - 1, cy]);
        stack.push([cx, cy + 1]);
        stack.push([cx, cy - 1]);
    }
}

function hexToRgba(hex, opacity) {
    const value = hex.replace('#', '');
    const bigint = parseInt(value, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return [r, g, b, Math.round(opacity * 255)];
}

function setupCanvasEvents() {
    canvas.addEventListener('pointerdown', event => {
        canvas.setPointerCapture(event.pointerId);
        startStroke(event);
    });
    canvas.addEventListener('pointermove', event => moveStroke(event));
    canvas.addEventListener('pointerup', event => endStroke(event));
    canvas.addEventListener('pointercancel', event => endStroke(event));
    canvas.addEventListener('pointerleave', event => endStroke(event));
}

function openModal(modal) {
    modal.classList.remove('hidden');
}

function closeModal(modal) {
    modal.classList.add('hidden');
}

async function authorizeCreate(password) {
    const response = await fetch('/api/create/authorize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
    });
    return response.json();
}

async function fetchMyTextures() {
    const response = await fetch('/api/my-textures');
    return response.json();
}

async function saveDraft() {
    const imageData = canvas.toDataURL('image/png');
    const response = await fetch('/api/drafts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: 'Draft Texture',
            imageData,
            description: '',
            category: 'Community',
            tags: '',
        }),
    });
    const payload = await response.json();
    if (response.ok) {
        setMessage('Draft saved.');
    } else {
        setMessage(payload.error || 'Failed to save draft.', true);
    }
}

async function publishTexture() {
    const name = document.getElementById('publishName').value.trim();
    const description = document.getElementById('publishDescription').value.trim();
    const category = document.getElementById('publishCategory').value;
    const tags = document.getElementById('publishTags').value.trim();
    if (!name || !description || !tags) {
        document.getElementById('publishError').textContent = 'Please fill all fields.';
        return;
    }
    const imageData = canvas.toDataURL('image/png');
    const response = await fetch('/api/textures', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description, category, tags, imageData }),
    });
    const payload = await response.json();
    if (response.ok) {
        document.getElementById('publishError').textContent = '';
        setMessage('Texture published successfully!');
        closeModal(document.getElementById('publishModal'));
        if (payload.url) {
            window.open(payload.url, '_blank');
        }
    } else {
        document.getElementById('publishError').textContent = payload.error || 'Publish failed.';
    }
}

function loadImageFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
        const img = new Image();
        img.onload = () => {
            initNewTexture(img.width, img.height);
            canvasContext.clearRect(0, 0, canvas.width, canvas.height);
            canvasContext.drawImage(img, 0, 0, canvas.width, canvas.height);
            pushHistory();
            setMessage('Uploaded image loaded into editor.');
        };
        img.src = reader.result;
    };
    reader.readAsDataURL(file);
}

function openFilePicker() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.png,.jpg,.jpeg,.webp';
    input.onchange = () => {
        if (input.files && input.files[0]) {
            loadImageFile(input.files[0]);
        }
    };
    input.click();
}

function openMyTexturesList() {
    openModal(document.getElementById('myTexturesModal'));
    fetchMyTextures().then(payload => {
        const list = document.getElementById('myTexturesList');
        list.innerHTML = '';
        if (!payload.textures || payload.textures.length === 0) {
            list.innerHTML = '<p>Nu ai texturi create încă.</p>';
            return;
        }
        payload.textures.forEach(texture => {
            const card = document.createElement('div');
            card.className = 'my-texture-card';
            card.innerHTML = `
                <h4>${escapeHtml(texture.name)}</h4>
                <div>${escapeHtml(texture.category)} • ${escapeHtml((texture.tags || []).join(', '))}</div>
                <div class="my-texture-actions">
                    <button onclick="window.open('/texture/${texture.id}','_blank')">View</button>
                    <button onclick="copyLink('/texture/${texture.id}', this)">Copy Link</button>
                    <button onclick="deleteTexture('${texture.id}', this)">Delete</button>
                </div>
            `;
            list.appendChild(card);
        });
    }).catch(() => {
        document.getElementById('myTexturesList').innerHTML = '<p>Nu am putut încărca texturile tale.</p>';
    });
}

async function deleteTexture(id, button) {
    if (!confirm('Are you sure you want to delete this texture?')) return;
    const response = await fetch(`/api/textures/${id}`, { method: 'DELETE' });
    const payload = await response.json();
    if (response.ok) {
        button.textContent = 'Deleted';
        button.disabled = true;
        openMyTexturesList();
    } else {
        alert(payload.error || 'Delete failed.');
    }
}

function createCanvasPrompt() {
    const preset = prompt('Choose a preset or custom size: 16, 32, 64, 128, 256, 512, 1024 or WIDTHxHEIGHT', '256');
    if (!preset) return;
    const parts = preset.toLowerCase().split('x').map(part => part.trim());
    let width = Number(parts[0]);
    let height = parts.length === 2 ? Number(parts[1]) : width;
    if (!width || !height || width <= 0 || height <= 0 || width > 2048 || height > 2048) {
        alert('Invalid size. Use a preset or custom size up to 2048.');
        return;
    }
    initNewTexture(width, height);
}

function setupInterface() {
    document.getElementById('openCreateButton').addEventListener('click', () => {
        closeModal(document.getElementById('createAccessModal'));
        openModal(document.getElementById('createEditorModal'));
        if (!canvas.width || !canvas.height) {
            initNewTexture(256, 256);
        }
    });
    document.getElementById('closeCreateAccess').addEventListener('click', () => closeModal(document.getElementById('createAccessModal')));
    document.getElementById('cancelCreateAccess').addEventListener('click', () => closeModal(document.getElementById('createAccessModal')));
    document.getElementById('togglePassword').addEventListener('click', () => {
        const input = document.getElementById('createPassword');
        input.type = input.type === 'password' ? 'text' : 'password';
        document.getElementById('togglePassword').textContent = input.type === 'password' ? 'Show' : 'Hide';
    });
    document.getElementById('continueCreateAccess').addEventListener('click', async () => {
        const password = document.getElementById('createPassword').value;
        const payload = await authorizeCreate(password);
        if (payload.authorized) {
            state.authorized = true;
            closeModal(document.getElementById('createAccessModal'));
            openModal(document.getElementById('createEditorModal'));
            if (!canvas.width || !canvas.height) {
                initNewTexture(256, 256);
            }
        } else {
            document.getElementById('createAccessError').textContent = payload.message || 'Incorrect password.';
        }
    });
    document.getElementById('closeEditor').addEventListener('click', () => closeModal(document.getElementById('createEditorModal')));
    document.getElementById('uploadImage').addEventListener('click', openFilePicker);
    document.getElementById('newTexture').addEventListener('click', createCanvasPrompt);
    document.getElementById('undoButton').addEventListener('click', undo);
    document.getElementById('redoButton').addEventListener('click', redo);
    document.getElementById('resetButton').addEventListener('click', () => {
        if (confirm('Reset will remove current changes. Continue?')) {
            initNewTexture(state.canvasSize.width, state.canvasSize.height);
        }
    });
    document.getElementById('saveDraft').addEventListener('click', saveDraft);
    document.getElementById('publishTexture').addEventListener('click', () => openModal(document.getElementById('publishModal')));
    document.getElementById('closePublishModal').addEventListener('click', () => closeModal(document.getElementById('publishModal')));
    document.getElementById('cancelPublish').addEventListener('click', () => closeModal(document.getElementById('publishModal')));
    document.getElementById('confirmPublish').addEventListener('click', publishTexture);
    document.getElementById('openMyTexturesButton').addEventListener('click', openMyTexturesList);
    document.getElementById('openMyTextures').addEventListener('click', openMyTexturesList);
    document.getElementById('closeMyTextures').addEventListener('click', () => closeModal(document.getElementById('myTexturesModal')));
    document.querySelectorAll('.tool-button').forEach(button => {
        button.addEventListener('click', () => setActiveTool(button.dataset.tool));
    });
    ['colorPicker', 'brushSize', 'opacity', 'brightness', 'contrast', 'saturation', 'blur'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateBrush);
    });
    document.getElementById('grayscaleButton').addEventListener('click', () => applyPresetFilter('grayscale'));
    document.getElementById('sepiaButton').addEventListener('click', () => applyPresetFilter('sepia'));
    document.getElementById('invertButton').addEventListener('click', () => applyPresetFilter('invert'));
}

function applyPresetFilter(type) {
    const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        if (type === 'grayscale') {
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            data[i] = data[i + 1] = data[i + 2] = gray;
        } else if (type === 'sepia') {
            data[i] = Math.min(255, 0.393 * r + 0.769 * g + 0.189 * b);
            data[i + 1] = Math.min(255, 0.349 * r + 0.686 * g + 0.168 * b);
            data[i + 2] = Math.min(255, 0.272 * r + 0.534 * g + 0.131 * b);
        } else if (type === 'invert') {
            data[i] = 255 - r;
            data[i + 1] = 255 - g;
            data[i + 2] = 255 - b;
        }
    }
    canvasContext.putImageData(imageData, 0, 0);
    pushHistory();
}

function escapeHtml(text) {
    return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function escapeAttribute(text) {
    return text
        .replaceAll('\\', '\\\\')
        .replaceAll("'", "\\'");
}
