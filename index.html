<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evoblox Texture Library</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #181818;
    padding: 18px;
    border-bottom: 1px solid #333;
}

h1 {
    margin: 0 0 12px;
}

#search {
    width: 100%;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
}

#count {
    margin-top: 8px;
    color: #999;
}

main {
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
}

.card {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: contain;
    display: block;
    background: #080808;
}

.info {
    padding: 12px;
}

.name {
    font-weight: bold;
    word-break: break-word;
}

.path {
    margin-top: 6px;
    color: #888;
    font-size: 12px;
    word-break: break-all;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

button,
.open {
    flex: 1;
    padding: 9px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
}

button {
    background: #333;
    color: white;
}

.open {
    background: white;
    color: black;
}
</style>
</head>

<body>

<header>
    <h1>🍌 Evoblox Texture Library</h1>

    <input
        id="search"
        type="text"
        placeholder="Caută imagine sau folder..."
    >

    <div id="count">0 imagini</div>
</header>

<main>
    <div id="grid" class="grid"></div>
</main>

<script>

/*
====================================================
AICI VOM PUNE LISTA IMAGINILOR
====================================================
*/

const images = [

];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");

function showImages(list) {

    grid.innerHTML = "";

    list.forEach((image, index) => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <a href="${image.url}" target="_blank">
                <img src="${image.url}" loading="lazy">
            </a>

            <div class="info">

                <div class="name">
                    #${index + 1} — ${image.name}
                </div>

                <div class="path">
                    ${image.path}
                </div>

                <div class="buttons">

                    <a
                        class="open"
                        href="${image.url}"
                        target="_blank"
                    >
                        Open
                    </a>

                    <button
                        onclick="copyLink('${image.url}', this)"
                    >
                        Copy link
                    </button>

                </div>

            </div>
        `;

        grid.appendChild(card);
    });

    count.textContent = list.length + " imagini";
}

async function copyLink(url, button) {

    try {

        await navigator.clipboard.writeText(url);

        const old = button.textContent;

        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = old;
        }, 1200);

    } catch {

        prompt("Copiază linkul:", url);

    }
}

search.addEventListener("input", () => {

    const text = search.value.toLowerCase();

    const filtered = images.filter(image =>
        image.name.toLowerCase().includes(text) ||
        image.path.toLowerCase().includes(text)
    );

    showImages(filtered);
});

showImages(images);

</script>

</body>
</html>
