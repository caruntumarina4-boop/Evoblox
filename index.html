<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evoblox Texture Library</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #181818;
    padding: 18px;
    border-bottom: 1px solid #333;
}

h1 {
    margin: 0 0 12px;
    font-size: 26px;
}

#search {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: white;
    font-size: 16px;
    outline: none;
}

#count {
    margin-top: 8px;
    color: #999;
}

main {
    padding: 20px;
}

.folder {
    margin-bottom: 30px;
}

.folder-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
}

.card {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 200px;
    display: block;
    object-fit: contain;
    background: #080808;
}

.info {
    padding: 12px;
}

.name {
    font-weight: bold;
    word-break: break-word;
}

.path {
    margin-top: 6px;
    color: #888;
    font-size: 12px;
    word-break: break-all;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

button,
.open {
    flex: 1;
    padding: 9px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
}

button {
    background: #333;
    color: white;
}

.open {
    background: white;
    color: black;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #aaa;
}

.error {
    background: #300;
    border: 1px solid #700;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>

    <h1>🍌 Evoblox Texture Library</h1>

    <input
        id="search"
        type="text"
        placeholder="Caută imagine sau folder..."
    >

    <div id="count">
        Se încarcă imaginile...
    </div>

</header>

<main>

    <div id="content" class="loading">
        Se încarcă toate imaginile din GitHub...
    </div>

</main>

<script>

const OWNER = "caruntumarina4-boop";
const REPOSITORY = "Evoblox";
const BRANCH = "main";

const BASE_URL =
    `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/${BRANCH}`;

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`;

let allImages = [];


async function loadImages() {

    const content = document.getElementById("content");
    const count = document.getElementById("count");

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("GitHub API error: " + response.status);
        }

        const data = await response.json();

        if (!data.tree) {
            throw new Error("GitHub nu a returnat lista fișierelor.");
        }

        allImages = data.tree
            .filter(item => item.type === "blob")
            .filter(item => {

                const extension =
                    item.path.split(".").pop().toLowerCase();

                return [
                    "png",
                    "jpg",
                    "jpeg",
                    "webp",
                    "gif",
                    "bmp"
                ].includes(extension);

            })
            .map(item => {

                const encodedPath = item.path
                    .split("/")
                    .map(part => encodeURIComponent(part))
                    .join("/");

                return {
                    name: item.path.split("/").pop(),
                    path: item.path,
                    url: `${BASE_URL}/${encodedPath}`
                };

            });

        renderImages(allImages);

    } catch (error) {

        content.innerHTML = `
            <div class="error">
                <h2>Nu am putut încărca imaginile.</h2>
                <p>${error.message}</p>
            </div>
        `;

        count.textContent = "Eroare";

        console.error(error);
    }
}


function renderImages(images) {

    const content = document.getElementById("content");
    const count = document.getElementById("count");

    content.className = "";

    if (images.length === 0) {

        content.innerHTML = `
            <div class="loading">
                Nu există imagini găsite.
            </div>
        `;

        count.textContent = "0 imagini";

        return;
    }


    const folders = {};


    images.forEach(image => {

        const parts = image.path.split("/");

        let folder;

        if (parts.length === 1) {
            folder = "ROOT";
        } else {
            folder = parts[0];
        }

        if (!folders[folder]) {
            folders[folder] = [];
        }

        folders[folder].push(image);

    });


    content.innerHTML = "";


    Object.keys(folders)
        .sort()
        .forEach(folderName => {

            const folder = document.createElement("section");

            folder.className = "folder";


            const title = document.createElement("div");

            title.className = "folder-title";

            title.textContent =
                folderName + " (" + folders[folderName].length + ")";


            const grid = document.createElement("div");

            grid.className = "grid";


            folders[folderName].forEach((image, index) => {

                const card = document.createElement("div");

                card.className = "card";


                card.innerHTML = `

                    <a
                        href="${image.url}"
                        target="_blank"
                    >

                        <img
                            src="${image.url}"
                            loading="lazy"
                            alt="${escapeHtml(image.name)}"
                        >

                    </a>


                    <div class="info">

                        <div class="name">
                            ${index + 1}. ${escapeHtml(image.name)}
                        </div>


                        <div class="path">
                            ${escapeHtml(image.path)}
                        </div>


                        <div class="buttons">

                            <a
                                class="open"
                                href="${image.url}"
                                target="_blank"
                            >
                                Open
                            </a>


                            <button
                                onclick="copyLink('${escapeAttribute(image.url)}', this)"
                            >
                                Copy link
                            </button>

                        </div>

                    </div>

                `;


                grid.appendChild(card);

            });


            folder.appendChild(title);

            folder.appendChild(grid);

            content.appendChild(folder);

        });


    count.textContent =
        images.length + " imagini";

}


function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(text) {

    return text
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");

}


async function copyLink(url, button) {

    try {

        await navigator.clipboard.writeText(url);

        const oldText = button.textContent;

        button.textContent = "✓ Copiat!";

        setTimeout(() => {

            button.textContent = oldText;

        }, 1200);

    } catch {

        prompt(
            "Copiază linkul:",
            url
        );

    }

}


document
    .getElementById("search")
    .addEventListener("input", function() {

        const text =
            this.value.toLowerCase();

        const filtered =
            allImages.filter(image =>

                image.name
                    .toLowerCase()
                    .includes(text)

                ||

                image.path
                    .toLowerCase()
                    .includes(text)

            );

        renderImages(filtered);

    });


loadImages();

</script>

</body>
</html>
